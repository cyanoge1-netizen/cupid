<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="#0B5D3B"/>

  <!-- Left Ring: Gold #F2B632 -->
  <circle cx="212" cy="256" r="78" fill="none" stroke="#F2B632" stroke-width="28"/>

  <!-- Right Ring: White #FFFFFF -->
  <circle cx="300" cy="256" r="78" fill="none" stroke="#FFFFFF" stroke-width="28"/>

  <!-- Gold Arc at overlap so the gold ring passes over the white one -->
  <path d="M 232.19 180.66 A 78 78 0 0 1 275.89 211.26" fill="none" stroke="#F2B632" stroke-width="28" stroke-linecap="butt"/>
</svg>
